<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Aryan Kumar Singh" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<clipPath id="r"><rect width="900" height="250" rx="18"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#101c2e"/><stop offset="1" stop-color="#1f2328fff"/></linearGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#bc8cff"/><stop offset="1" stop-color="#3fb950"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-.6 0" to=".6 0" dur="7s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="g1"><stop offset="0" stop-color="#58a6ff" stop-opacity=".35"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#bc8cff" stop-opacity=".30"/><stop offset="1" stop-color="#bc8cff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#58a6ff" stroke-opacity=".07"/></pattern>
</defs>
<style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.f{fill:#58a6ff;opacity:.28;font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;animation:float 6s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.sub{font-size:21px;fill:#9fb3c8;letter-spacing:1.5px;animation:sub 12s infinite both}
@keyframes sub{0%{opacity:0;transform:translateY(10px)}4%{opacity:1;transform:translateY(0)}21%{opacity:1;transform:translateY(0)}25%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
.hi{font-size:15px;fill:#656d76;letter-spacing:6px;animation:fade 1.2s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.nm{font-size:58px;font-weight:800;fill:url(#nm);letter-spacing:1px;animation:pop 1.2s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.ul{transform-box:fill-box;transform-origin:center;animation:ul 1.6s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes ul{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.orb{animation:orb 9s ease-in-out infinite alternate}
@keyframes orb{from{transform:translate(0,0)}to{transform:translate(60px,20px)}}
</style>
<g clip-path="url(#r)">
<rect width="900" height="250" fill="url(#bg)"/>
<rect width="900" height="250" fill="url(#grid)"/>
<circle class="orb" cx="170" cy="60" r="190" fill="url(#g1)"/>
<circle class="orb" cx="760" cy="90" r="170" fill="url(#g2)" style="animation-direction:alternate-reverse"/>
<text class="f" x="70" y="70" font-size="34" style="animation-delay:0s;animation-duration:6s">{ }</text>
<text class="f" x="810" y="60" font-size="30" style="animation-delay:1.2s;animation-duration:7s">&lt;/&gt;</text>
<text class="f" x="150" y="150" font-size="26" style="animation-delay:0.6s;animation-duration:5.5s">01</text>
<text class="f" x="760" y="140" font-size="26" style="animation-delay:2s;animation-duration:6.5s">&amp;&amp;</text>
<text class="f" x="40" y="150" font-size="32" style="animation-delay:1.5s;animation-duration:7s">λ</text>
<text class="f" x="860" y="130" font-size="30" style="animation-delay:0.3s;animation-duration:6s">Σ</text>
<text class="f" x="300" y="40" font-size="24" style="animation-delay:2.2s;animation-duration:5s">[ ]</text>
<text class="f" x="600" y="38" font-size="24" style="animation-delay:0.9s;animation-duration:6s">++</text>
<text class="f" x="700" y="180" font-size="20" style="animation-delay:1.8s;animation-duration:7s">O(n)</text>
<text class="f" x="210" y="190" font-size="20" style="animation-delay:2.6s;animation-duration:6s">git</text>
<text class="hi" x="450" y="62" text-anchor="middle">HELLO WORLD, I'M</text>
<text class="nm" x="450" y="122" text-anchor="middle" style="transform-origin:450px 100px">Aryan Kumar Singh</text>
<rect class="ul" x="330" y="136" width="240" height="3" rx="1.5" fill="url(#nm)"/>
<text class="sub" x="450" y="158" text-anchor="middle" style="animation-delay:0s;opacity:1">B.Tech CSE Student</text>
<text class="sub" x="450" y="158" text-anchor="middle" style="animation-delay:3s;opacity:0">Software Developer in the making</text>
<text class="sub" x="450" y="158" text-anchor="middle" style="animation-delay:6s;opacity:0">DSA  ·  Problem Solver</text>
<text class="sub" x="450" y="158" text-anchor="middle" style="animation-delay:9s;opacity:0">Exploring AI / ML</text>
<path d="M0 205 Q112 191 225 205 T450 205 T675 205 T900 205 T1125 205 T1350 205 T1575 205 T1800 205 V250 H0 Z" fill="#58a6ff" fill-opacity="0.13"><animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="11s" repeatCount="indefinite"/></path>
<path d="M0 214 Q112 195 225 214 T450 214 T675 214 T900 214 T1125 214 T1350 214 T1575 214 T1800 214 V250 H0 Z" fill="#bc8cff" fill-opacity="0.13"><animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="8s" repeatCount="indefinite"/></path>
<path d="M0 223 Q112 199 225 223 T450 223 T675 223 T900 223 T1125 223 T1350 223 T1575 223 T1800 223 V250 H0 Z" fill="#3fb950" fill-opacity="0.20"><animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="6s" repeatCount="indefinite"/></path>
</g>
<rect x=".5" y=".5" width="899" height="249" rx="18" fill="none" stroke="#d8dee4"/>
</svg>