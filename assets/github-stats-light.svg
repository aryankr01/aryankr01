<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" fill="none" role="img" aria-label="GitHub Stats">
<defs>
<clipPath id="c"><rect width="440" height="210" rx="14"/></clipPath>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#bc8cff"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
<linearGradient id="lc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffa116"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>
</defs>
<style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.t{font-size:15px;font-weight:600;fill:#1f2328}
.u{font-size:12px;fill:#656d76}
.n{font-size:25px;font-weight:700}
.l{font-size:12px;fill:#656d76}
.s{font-size:11px;fill:#818a91}
.a{animation:fade .8s ease-out both}
.g{transform-box:fill-box;transform-origin:left center;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
.ring{animation:ring 1.6s cubic-bezier(.2,.8,.2,1) both}
.dl{stroke-dasharray:1;animation:draw 2.6s ease-out both}
.bar{animation:sheen 4s ease-in-out infinite alternate}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{from{stroke-dasharray:0 100}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes sheen{from{opacity:.55}to{opacity:1}}
</style>
<g clip-path="url(#c)">
<rect width="440" height="210" fill="#1f2328fff"/>
<rect width="440" height="3" fill="url(#ac)" class="bar"/>
<circle cx="410" cy="-20" r="110" fill="#58a6ff" fill-opacity=".06"/>
<circle cx="14" cy="22" r="4" fill="#58a6ff"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
<text class="t" x="28" y="27">GitHub Stats</text>
<text class="u" x="420" y="27" text-anchor="end">@aryankr01</text>
<g class="a" style="animation-delay:0.00s"><rect x="18" y="58" width="3" height="38" rx="1.5" fill="#58a6ff"/><text class="n" x="28" y="84" fill="#58a6ff">0</text><text class="l" x="28" y="100">Total Stars</text></g>
<g class="a" style="animation-delay:0.12s"><rect x="226" y="58" width="3" height="38" rx="1.5" fill="#bc8cff"/><text class="n" x="236" y="84" fill="#bc8cff">12</text><text class="l" x="236" y="100">Commits (1y)</text></g>
<g class="a" style="animation-delay:0.24s"><rect x="18" y="102" width="3" height="38" rx="1.5" fill="#3fb950"/><text class="n" x="28" y="128" fill="#3fb950">0</text><text class="l" x="28" y="144">Pull Requests</text></g>
<g class="a" style="animation-delay:0.36s"><rect x="226" y="102" width="3" height="38" rx="1.5" fill="#ffa657"/><text class="n" x="236" y="128" fill="#ffa657">0</text><text class="l" x="236" y="144">Issues</text></g>
<g class="a" style="animation-delay:0.48s"><rect x="18" y="146" width="3" height="38" rx="1.5" fill="#ff7b72"/><text class="n" x="28" y="172" fill="#ff7b72">7</text><text class="l" x="28" y="188">Public Repos</text></g>
<g class="a" style="animation-delay:0.60s"><rect x="226" y="146" width="3" height="38" rx="1.5" fill="#79c0ff"/><text class="n" x="236" y="172" fill="#79c0ff">5</text><text class="l" x="236" y="188">Followers</text></g>
</g>
<rect x=".5" y=".5" width="439" height="209" rx="14" stroke="#d8dee4"/>
</svg>